<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Directorio de empleados</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="empleados.js" defer></script>
</head>
<body>
<main>
    <h1>Directorio de empleados</h1>
    <section aria-labelledby="titulo-formulario">
        <h2 id="titulo-formulario">Registrar empleado</h2>
        <form id="empleado">
            <div class="campos">
                <label>Nombre <input name="nombre" required maxlength="100"></label>
                <label>Apellido <input name="apellido" required maxlength="100"></label>
                <label>Correo electrónico <input name="email" type="email" required maxlength="150"></label>
                <label>Especialidad (opcional) <input name="especialidad" maxlength="100"></label>
            </div>
            <div class="acciones">
                <button id="guardar">Registrar</button>
                <button id="cancelar" type="button" class="secundario" hidden>Cancelar edición</button>
            </div>
            <p id="resultado" role="status"></p>
        </form>
    </section>
    <section aria-labelledby="titulo-listado">
        <h2 id="titulo-listado">Empleados registrados</h2>
        <form id="busqueda">
            <label>Buscar por nombre, apellido o especialidad <input name="filtro" type="search"></label>
            <button>Buscar</button>
            <button id="limpiar" type="button" class="secundario">Limpiar</button>
        </form>
        <p id="estado-listado" role="status"></p>
        <div class="tabla">
            <table>
                <thead>
                <tr><th>ID</th><th>Nombre</th><th>Apellido</th><th>Correo</th><th>Especialidad</th><th>Acciones</th></tr>
                </thead>
                <tbody id="filas"></tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
